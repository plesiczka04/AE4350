# NEAT configuration for evolving quadrotor controllers.
# 12 tracking-error inputs -> 3 command outputs [thrust, roll, pitch], tanh nodes.
# Starts fully-connected with no hidden nodes and complexifies (adds nodes/conns).
# pop_size and the RNG seed are overridden programmatically per run.

[NEAT]
fitness_criterion     = max
fitness_threshold     = 1000.0
no_fitness_termination = True
pop_size              = 20
reset_on_extinction   = True

[DefaultGenome]
# node activation
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh

# node aggregation
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# node bias
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1

# genome compatibility (speciation)
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

# connection add/remove rates -> topology evolution
conn_add_prob           = 0.5
conn_delete_prob        = 0.2

# connection enable/disable
enabled_default         = True
enabled_mutate_rate     = 0.01

feed_forward            = True
initial_connection      = full_direct

# node add/remove rates -> topology evolution
node_add_prob           = 0.2
node_delete_prob        = 0.1

# network parameters
num_hidden              = 0
num_inputs              = 12
num_outputs             = 3

# response (per-node output scaling)
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

# connection weights
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 20
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
